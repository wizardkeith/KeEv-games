const e=new Engine(document.querySelector('canvas'),true),s=new Scene(e);s.useRightHandedSystem=true;s.clearColor=Color4.FromHexString('#EEE6D9FF');const c=new ArcRotateCamera('qa',-Math.PI/2,Math.PI/3,5.6,new Vector3(0,.12,0),s);c.fov=.55;c.attachControl(document.querySelector('canvas'),true);const l=new HemisphericLight('fill',new Vector3(0,1,0),s);l.intensity=.8;const sun=new DirectionalLight('key',new Vector3(.6,-.8,.5),s);sun.intensity=2;const atlas=new Texture(botanicalPrintMaterial.path,s,false,false),cloth=new Texture('/assets/native-v10/cloth-weave-basecolor.png',s),wood=new Texture('/assets/native-v10/timber-colour.png',s);cloth.uScale=cloth.vScale=16;

await s.whenReadyAsync();window.galleryReady={ids,renderer:e.getGlInfo(),triangles:s.meshes.reduce((n,m)=>n+m.getTotalIndices()/3,0)};e.runRenderLoop(()=>s.render());</script></html>
